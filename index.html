<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Il Cerchio del Richiamo — Pesca una Carta</title>
<meta name="description" content="Pesca una carta dei tarocchi Rider-Waite e ricevi la sua spiegazione, ogni volta che vuoi.">
<meta name="theme-color" content="#0b0710">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="bg-photo" aria-hidden="true"></div>
<div class="bg-veil" aria-hidden="true"></div>

<div class="app">

  <header class="site-header">
    <img class="brand-logo" src="assets/logo.png" alt="Il Cerchio del Richiamo">
    <h1 class="site-title">Il Cerchio<br>del Richiamo</h1>
    <p class="site-subtitle">Estrai una carta e ascolta ciò che ha da dirti</p>
  </header>

  <main class="reading-area">

    <div class="stage" id="stage">
      <button class="card" id="cardButton" type="button" aria-label="Pesca una carta dei tarocchi">
        <div class="card-inner" id="cardInner">

          <div class="card-face card-back is-active">
            <div class="card-back-frame">
              <svg viewBox="0 0 100 160" class="card-back-art">
                <rect x="3" y="3" width="94" height="154" rx="4" class="cb-border"/>
                <circle cx="50" cy="80" r="30" class="cb-circle-1"/>
                <circle cx="50" cy="80" r="20" class="cb-circle-2"/>
                <circle cx="50" cy="80" r="3" class="cb-dot"/>
                <g class="cb-rays">
                  <line x1="50" y1="20" x2="50" y2="40"/>
                  <line x1="50" y1="120" x2="50" y2="140"/>
                  <line x1="10" y1="80" x2="30" y2="80"/>
                  <line x1="70" y1="80" x2="90" y2="80"/>
                  <line x1="21" y1="51" x2="34" y2="64"/>
                  <line x1="79" y1="109" x2="66" y2="96"/>
                  <line x1="79" y1="51" x2="66" y2="64"/>
                  <line x1="21" y1="109" x2="34" y2="96"/>
                </g>
              </svg>
              <span class="card-back-label">TOCCA<br>PER PESCARE</span>
            </div>
          </div>

          <div class="card-face card-front">
            <img id="cardImage" class="card-image" src="" alt="">
          </div>

        </div>
      </button>
    </div>

    <p class="hint" id="hint">Tocca la carta per ricevere il tuo messaggio</p>

    <section class="result" id="result" aria-live="polite">
      <h2 class="result-name" id="resultName"></h2>
      <p class="result-text" id="resultText"></p>
      <button class="draw-again" id="drawAgain" type="button">Pesca un'altra carta</button>
    </section>

  </main>

  <footer class="site-footer">
    <span>Il Cerchio del Richiamo</span>
  </footer>

</div>

<script src="js/cards.js"></script>
<script src="js/app.js"></script>
</body>
</html>
